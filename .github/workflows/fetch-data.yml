# IBKR book data (positions/account/pnl/benchmarks) is refreshed by the MCP
# pipeline (scripts/mcp_refresh.py, run from Claude sessions/Routines) and
# committed to master. This workflow refreshes the DERIVED layers (Yahoo
# cross-val, micro prices/scores, risk, signal scorecard), verifies the data,
# and deploys the static site to GitHub Pages.
name: Refresh Derived Data & Deploy

on:
  push:
    branches: [master]
    # Any push to master redeploys — including on-demand data refreshes (a human
    # or PR merge committing fresh data/*.json). The workflow's OWN data commits
    # use GITHUB_TOKEN, and GITHUB_TOKEN-authored pushes never trigger workflows,
    # so the scheduled fetch can't set off a deploy loop.
  schedule:
    # Times are UTC and fixed; the Israel equivalents below assume IDT (UTC+3,
    # the Israel summer offset). During IST (winter) each run lands one hour
    # earlier Israel time — i.e. 15:45 and 19:00.
    - cron: '45 13 * * 1-5'   # 16:45 Israel time
    - cron: '0 17 * * 1-5'    # 20:00 Israel time
  workflow_dispatch: # Allow manual trigger from the Actions UI
    inputs:
      scope:
        # value 'ibkr' kept for backward compatibility with old triggers;
        # it now just means "risk/deploy only, skip the micro price refresh"
        description: 'full = derived-data refresh · ibkr = risk/deploy only (skip micro)'
        type: choice
        options:
          - full
          - ibkr
        default: full
        required: false

# contents: commit the rolling P&L history · pages/id-token: deploy to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress data commit finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      # MetalMiner price series (licensed): pulled from the MetalMiner API with the
      # METALMINER_API_TOKEN secret into /tmp (never committed), then graded by
      # mm_series_quality.py (registry + report are derived, committed) and run
      # through the rare-earth lead/lag research (equities from Yahoo, also /tmp).
      # data/mm_freshness.json records how far behind the latest observation is —
      # the publication delay the research scripts take as --delay. Every step is
      # best-effort: no secret or a vendor hiccup leaves the last-good files in place.
      - name: MetalMiner pull + series quality
        if: ${{ github.event.inputs.scope != 'ibkr' }}
        env:
          METALMINER_API_TOKEN: ${{ secrets.METALMINER_API_TOKEN }}
        run: |
          if [ -z "$METALMINER_API_TOKEN" ]; then echo "METALMINER_API_TOKEN not set — MetalMiner pull skipped"; exit 0; fi
          python scripts/mm_fetch.py --out /tmp/historical_latest.json.gz || { echo "mm_fetch failed (non-fatal)"; exit 0; }
          python scripts/mm_series_quality.py /tmp/historical_latest.json.gz > /dev/null || echo "mm_series_quality failed (non-fatal)"
          python scripts/mm_equities.py --out /tmp/mm_equities.json || echo "mm_equities failed (non-fatal)"
          if [ -f /tmp/mm_equities.json ] && [ -f scripts/rare_earth_leadlag.py ]; then
            DELAY=$(python -c "import json;d=json.load(open('data/mm_freshness.json'));print(max(1, d['series'].get('270930', {}).get('lagDays', 11)))" 2>/dev/null || echo 11)
            python scripts/rare_earth_leadlag.py /tmp/historical_latest.json.gz --equities /tmp/mm_equities.json --delay "$DELAY" > /dev/null || echo "rare_earth_leadlag failed (non-fatal)"
          fi
          rm -f /tmp/historical_latest.json.gz /tmp/mm_equities.json

      # Independent Yahoo Finance cross-validation pull for the Stock Picks cards
      # (yfinance, no secrets). Yahoo egress is reliable from CI but blocked in the
      # Claude research sessions, so the Action is the dependable home for this pull.
      # Once/day is plenty for a validation layer, so this runs only on the 20:00
      # Israel-time cron plus push/manual full runs (not both crons) to stay light on Yahoo.
      # Best-effort: a hiccup or rate-limit just leaves the last-good yahoo.json.
      - name: Yahoo cross-validation pull
        if: ${{ github.event.inputs.scope != 'ibkr' && (github.event_name != 'schedule' || github.event.schedule == '0 17 * * 1-5') }}
        run: python scripts/micro_yahoo.py || echo "micro_yahoo skipped (non-fatal)"

      # Refresh the Stock Picks tab's live price/score layer (yfinance, no MCP, no
      # secrets). The research layer in micro.json is untouched — it's rebuilt once
      # a day pre-market by a separate Claude routine. This step also recomputes the
      # Yahoo cross-check from the committed yahoo.json (no network). Non-fatal if
      # yfinance hiccups. Skipped on an IBKR-only dashboard refresh (scope=ibkr). For
      # push/schedule events inputs are empty, so `!= 'ibkr'` is true and this runs.
      - name: Refresh micro scores
        if: ${{ github.event.inputs.scope != 'ibkr' }}
        run: python scripts/micro_refresh.py || echo "micro_refresh skipped (non-fatal)"

      # Auto-compute the live risk engine (vol/beta/VaR/HHI always; correlation matrix +
      # per-name risk contribution when price_history.json exists). Pure Python, stdlib
      # only, reads the freshly-written data/*.json. Runs on every refresh (incl. ibkr
      # scope) since the core metrics use pnl/positions/benchmarks. Non-fatal.
      - name: Compute risk metrics
        run: python scripts/risk.py || echo "risk skipped (non-fatal)"

      # Asset→commodity exposure tracking. Rewrites today's position_history snapshot
      # (converges to EOD, so intraday closes drop out) and recomputes the
      # family-filtered exposure_history. Previously only ran inside mcp_refresh (the
      # MCP book path), so the derived exposure lagged the book between MCP refreshes.
      - name: Compute exposure tracking
        run: python scripts/exposure.py || echo "exposure skipped (non-fatal)"

      # Signal-efficacy scorecard (rank-IC/IR of each micro sub-score vs forward returns)
      # + portfolio factor tilt. No-ops cheaply until micro_history.jsonl has enough days.
      - name: Compute signal scorecard
        if: ${{ github.event.inputs.scope != 'ibkr' }}
        run: python scripts/signal_ic.py || echo "signal_ic skipped (non-fatal)"

      # Process layer (see PROCESS.md): normalize committed FMP positioning dumps
      # (no-op until the positioning Routine commits them), score every data
      # channel against what it predicts (80% trust gate), backfill decision-log
      # outcomes, and rebuild the process-rule alerts. All offline from committed
      # data/, all non-fatal.
      - name: Normalize positioning (insiders + politicians)
        run: python scripts/positioning_build.py || echo "positioning skipped (non-fatal)"

      - name: Channel accuracy engine
        if: ${{ github.event.inputs.scope != 'ibkr' }}
        run: python scripts/channel_accuracy.py || echo "channel_accuracy skipped (non-fatal)"

      - name: Decision-log outcomes + process alerts
        run: |
          python scripts/decision_log.py --update-outcomes || echo "outcomes skipped (non-fatal)"
          python scripts/order_log.py --update-outcomes || echo "order outcomes skipped (non-fatal)"
          python scripts/alerts_build.py || echo "alerts skipped (non-fatal)"

      # Freeze every live data point (analysts, sentiment, fundamentals, scores,
      # positioning, nowcasts, ...) into history/daily/<date>.json.gz for later
      # analysis. Rewrites today's file each run -> converges to EOD state.
      - name: Record daily data snapshot
        run: python scripts/daily_snapshot.py || echo "daily snapshot skipped (non-fatal)"

      # Data-contract / schema gate (same one standards.yml runs on PRs). The bot
      # commits data straight to master, bypassing the PR gate, so run it here too
      # or a schema break (e.g. a data file blanked, micro.json losing
      # `recommendations`) would deploy. DELIBERATELY fatal.
      - name: Validate data contract
        run: python scripts/validate_data.py

      # Cross-file reconciliation gate: account vs positions identities, pnl
      # schema, benchmark set, micro book vs live book, freshness. DELIBERATELY
      # fatal — broken data must fail the run rather than deploy.
      - name: Verify data consistency
        run: python scripts/verify_data.py

      # Best-effort by design: the deliverable of this job is the DEPLOY, and the
      # site is assembled from the working tree below, not from what got pushed.
      # So a rejected push must never skip the deploy — it only means this run's
      # data isn't archived, and the next cycle regenerates it anyway.
      #
      # The push gets rejected whenever master moves while the run is working:
      # the run checks out master, spends ~2 min fetching and computing, and by
      # push time a merge or another commit has landed. The `pages` concurrency
      # group doesn't prevent this — it serialises workflow runs against each
      # other, not against pushes from outside the workflow. On 2026-08-09 five
      # PR merges landed mid-run and two deploys were skipped this way.
      - name: Commit rolling P&L history
        continue-on-error: true
        run: |
          git config user.name "metallica-bot"
          git config user.email "bot@metallica-dashboard.local"
          git add data/ history/ reports/
          if git diff --staged --quiet; then
            echo "No data changes this cycle."
            exit 0
          fi
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"

          for attempt in 1 2 3 4; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — master moved; rebasing onto it."
            # Plain rebase, no strategy option: a code merge touches different
            # files and replays cleanly. A genuine conflict means another run
            # wrote the same generated file, and blindly picking a side could
            # regress fresher data — CLAUDE.md forbids that — so bail out and
            # leave it to the next cycle instead of guessing.
            if ! git pull --rebase --no-edit; then
              git rebase --abort || true
              echo "::warning::Rebase conflicted on generated data — skipping this run's commit. The deploy still ships this run's data; the next cycle will re-commit it."
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::warning::Could not push the data commit after 4 attempts. The deploy still ships this run's data; the next cycle will re-commit it."

      - name: Assemble static site
        run: |
          rm -rf _site && mkdir -p _site
          cp index.html _site/
          cp -r data _site/
          touch _site/.nojekyll   # serve files verbatim, skip Jekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # auto-enables Pages (source = GitHub Actions) on first run

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
